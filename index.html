<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />

  <!-- Samaj Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    आदिवासी हल्बा/हल्बी समाज कल्याण समिति, उज्जैन | Official Portal
  </title>

  <meta
    name="description"
    content="आदिवासी हल्बा/हल्बी समाज कल्याण समिति, उज्जैन का आधिकारिक डिजिटल मंच। “गर्व से कहो हम आदिवासी हैं, भारत के मूल निवासी हैं”"
  />

  <!-- Anti-FOUC: Set theme before React renders to prevent color flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("samaj_theme");

        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>

<body>

  <div id="root"></div>

  <!-- Vite entry -->
  <script type="module" src="/src/index.jsx"></script>

</body>

</html>
