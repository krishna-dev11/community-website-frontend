<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpg" href="/community-website-frontend/src/assets/Images/Brain.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samaj Community Portal</title>
  <meta name="description"
    content="Samaj Community Portal — Connect, grow, and support your community. Member directory, family hub, matrimonial, scholarships, jobs and more." />
  <!-- Anti-FOUC: Set theme before React renders to prevent color flash (Default = LIGHT) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('samaj_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- IMPORTANT: Vite needs this script -->
  <script type="module" src="/src/index.jsx"></script>

</body>

</html>
